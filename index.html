<!doctype html>
<html lang="tr" data-tone="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find My Asistan</title>
<meta name="description" content="Ortopedi asistan nöbet, izin ve kadro paneli.">
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Find My Asistan">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<div class="launch" id="launch">
  <div class="launch-inner">
    <svg viewBox="0 0 24 24" width="66" height="66" aria-hidden="true">
      <defs><linearGradient id="lb-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbf3"/><stop offset="1" stop-color="#f0dbbf"/>
      </linearGradient></defs>
      <circle cx="12" cy="12" r="10.6" fill="none" stroke="#fff" stroke-width=".9" opacity=".26"/>
      <circle cx="12" cy="12" r="7.6" fill="hsl(32 94% 58%)" opacity=".2"/>
      <g transform="rotate(-22 12 12)" fill="url(#lb-g)">
        <rect x="8.28" y="10.19" width="7.44" height="3.62" rx="1.81"/>
        <circle cx="8.28" cy="10.01" r="2.85"/><circle cx="8.28" cy="13.99" r="2.85"/>
        <circle cx="15.72" cy="10.01" r="2.85"/><circle cx="15.72" cy="13.99" r="2.85"/>
      </g>
    </svg>
    <p class="launch-name">Find My <b>Asistan</b></p>
  </div>
</div>

<div class="ambient" aria-hidden="true">
  <div class="orb orb--a"></div>
  <div class="orb orb--b"></div>
  <div class="orb orb--c"></div>
</div>

<main class="shell">

  <!-- ========== 0. Kim kullanıyor ========== -->
  <section class="screen" data-screen="who">
    <div class="wordmark">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
        <circle cx="12" cy="12" r="7.6" fill="hsl(32 94% 58%)" opacity=".2"/>
        <g transform="rotate(-22 12 12)" fill="#fff2df">
          <rect x="8.28" y="10.4" width="7.44" height="3.2" rx="1.6"/>
          <circle cx="8.28" cy="10.55" r="2.5"/><circle cx="8.28" cy="13.45" r="2.5"/>
          <circle cx="15.72" cy="10.55" r="2.5"/><circle cx="15.72" cy="13.45" r="2.5"/>
        </g>
      </svg>
      <span>Find My <b>Asistan</b></span>
    </div>
    <h1 class="display">Hoş geldiniz</h1>
    <p class="subline">Paneli kimlerin kullandığını görebilmek için adınızı bir kez soruyoruz.</p>
    <form class="who-form" id="who-form">
      <input id="who-name" type="text" placeholder="Ad Soyad" autocomplete="name"
             autocapitalize="words" spellcheck="false" required maxlength="60">
      <button type="submit" class="btn-primary">Devam</button>
    </form>
    <p class="who-note">Şifre yok, kimse engellenmiyor. Yalnızca adınız ve
      çalıştığınız hastane kaydedilir — giriş kaydı tutulmaz.</p>
  </section>

  <!-- ========== 1. Hastane seçimi ========== -->
  <section class="screen" data-screen="hospitals" data-active>
    <header>
      <div class="wordmark">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <!-- Küçük boyda sadeleşmiş işaret: tek halka + kemik -->
          <defs><linearGradient id="bone-g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fffbf3"/><stop offset="1" stop-color="#f0dbbf"/>
          </linearGradient></defs>
          <circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
          <circle cx="12" cy="12" r="7.6" fill="hsl(32 94% 58%)" opacity=".2"/>
          <g transform="rotate(-22 12 12)" fill="url(#bone-g)">
            <rect x="8.28" y="10.19" width="7.44" height="3.62" rx="1.81"/>
            <circle cx="8.28" cy="10.01" r="2.85"/><circle cx="8.28" cy="13.99" r="2.85"/>
            <circle cx="15.72" cy="10.01" r="2.85"/><circle cx="15.72" cy="13.99" r="2.85"/>
          </g>
        </svg>
        <span>Find My <b>Asistan</b></span>
      </div>
      <h1 class="display" id="pick-day"></h1>
      <p class="subline" id="pick-date"></p>
    </header>
    <div class="hospital-grid stagger" id="hospital-grid"></div>
    <p class="foot" id="pick-foot"></p>
  </section>

</main>

<!-- ========== 2. Hastane sayfaları (yatay kaydırmalı) ========== -->
<section class="screen day-screen" data-screen="day">

  <div class="pager-head">
    <button class="icon-btn" id="btn-grid" aria-label="Tüm hastaneler">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
        <rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>
      </svg>
    </button>

    <button class="pager-id" id="btn-grid-2" aria-label="Tüm hastaneler">
      <span class="eyebrow" id="pager-date"></span>
      <h1 id="pager-name">—</h1>
    </button>

    <button class="icon-btn" id="btn-settings" aria-label="Ayarlar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/>
      </svg>
    </button>
  </div>

  <div class="dots" id="dots" role="tablist" aria-label="Hastaneler"></div>

  <div class="pager" id="pager"></div>
</section>


<script type="module" src="app/main.js"></script>
</body>
</html>
